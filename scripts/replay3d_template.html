<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3v2 Arena 3D</title>
<style>
  :root { --bg: #f6f7f9; --panel: #ffffff; --ink: #1d2330; --muted: #6b7385; --line: #d9dde5;
          --win: #15803d; --breach: #b91c1c; --crash: #b45309; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12151b; --panel: #1a1f28; --ink: #e6e9ef; --muted: #98a1b3; --line: #2c3340;
            --win: #4ade80; --breach: #f87171; --crash: #fbbf24; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1200px; margin: 0 auto; padding: 20px 16px 32px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { margin: 0 0 14px; color: var(--muted); }
  .controls { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-bottom: 10px; }
  .controls label { color: var(--muted); display: flex; gap: 6px; align-items: center; }
  select, button { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; }
  button { cursor: pointer; }
  input[type=range] { width: 100%; margin: 0 0 10px; }
  #view { width: 100%; height: min(70vh, 640px); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #c9d2de; }
  .row { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 20px; margin-top: 10px; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px 20px; font-variant-numeric: tabular-nums; }
  .banner { font-weight: 600; min-height: 1.45em; }
  .win { color: var(--win); } .breach { color: var(--breach); } .crash { color: var(--crash); }
  .hint { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>3v2 Arena 3D</h1>
  <p class="sub">Recorded from the Isaac Lab sim. Blue defenders block and push red attackers away from the goal tag on the wall.</p>
  <div class="controls">
    <label>Controller <select id="ctrl"></select></label>
    <label>Arena <select id="env"></select></label>
    <button id="play">Pause</button>
    <label>Speed <select id="speed"><option>0.5</option><option selected>1</option><option>2</option><option>4</option></select></label>
    <label>Camera <select id="cam"><option value="overview">Overview</option><option value="goal">Behind the goal</option><option value="top">Top down</option><option value="side">Side</option></select></label>
    <span id="clock" class="stats"></span>
  </div>
  <input id="scrub" type="range" min="0" value="0" aria-label="Time">
  <div id="view"></div>
  <div class="row">
    <div id="banner" class="banner"></div>
    <div id="score" class="stats"></div>
  </div>
  <p class="hint">Drag to orbit, scroll to zoom, right-drag to pan. Blue = defenders, red = attackers; a drone that goes down turns gray on the floor.</p>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const DATA = __DATA__;
const ARENA = __ARENA__;
const $ = (id) => document.getElementById(id);
Object.keys(DATA).forEach((n) => $("ctrl").add(new Option(n, n)));

// --- scene (arena frame: x into the room, y across, z up) -------------------------------------
const view = $("view");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio || 1);
renderer.shadowMap.enabled = true;
view.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xc9d2de);
const camera = new THREE.PerspectiveCamera(50, 1, 0.05, 100);
camera.up.set(0, 0, 1);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8f99, 0.75));
const sun = new THREE.DirectionalLight(0xffffff, 0.7);
sun.position.set(6, -4, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 0.5, far: 30 });
scene.add(sun);

const [[x0, x1], [y0, y1], [z0, z1]] = ARENA.room;
const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
function box(sx, sy, sz, color, opacity = 1) {
  const m = new THREE.MeshStandardMaterial({ color, roughness: 0.9, transparent: opacity < 1, opacity });
  return new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), m);
}
const floor = box(x1 - x0, y1 - y0, 0.02, 0x7b8291);
floor.position.set(cx, cy, -0.01);
floor.receiveShadow = true;
scene.add(floor);
const gridSize = Math.max(x1 - x0, y1 - y0);
const grid = new THREE.GridHelper(gridSize, gridSize, 0x9aa1ad, 0x9aa1ad);
grid.rotation.x = Math.PI / 2;
grid.position.set(cx, cy, 0.002);
scene.add(grid);
const goalWall = box(0.05, y1 - y0, z1 - z0, 0xe8eaee);
goalWall.position.set(x0 - 0.025, cy, (z0 + z1) / 2);
goalWall.receiveShadow = true;
scene.add(goalWall);
for (const yw of [y0 - 0.025, y1 + 0.025]) {
  const w = box(x1 - x0, 0.05, z1 - z0, 0xe8eaee, 0.25);
  w.position.set(cx, yw, (z0 + z1) / 2);
  scene.add(w);
}

// obstacles (e.g. the standing panels) and, for arenas with one, the far wall
(ARENA.obstacles || []).forEach((o) => {
  const m = box(...o.size, 0xe9e4d8);
  m.position.set(...o.center);
  m.castShadow = true;
  scene.add(m);
});
if (ARENA.far_wall) {
  const w = box(0.05, y1 - y0, z1 - z0, 0xe8eaee, 0.6);
  w.position.set(x1 + 0.025, cy, (z0 + z1) / 2);
  scene.add(w);
}

// textured AprilTags at their real poses (texture includes the white border)
ARENA.tags.forEach((t) => {
  const tex = new THREE.TextureLoader().load(t.png);
  tex.magFilter = THREE.NearestFilter;
  const side = t.size_m / t.black_frac;
  const quad = new THREE.Mesh(new THREE.PlaneGeometry(side, side), new THREE.MeshStandardMaterial({ map: tex, roughness: 1 }));
  const n = new THREE.Vector3(...t.normal).normalize(), u = new THREE.Vector3(...t.up).normalize();
  const r = new THREE.Vector3().crossVectors(u, n);
  quad.setRotationFromMatrix(new THREE.Matrix4().makeBasis(r, u, n));
  quad.position.set(...t.center).addScaledVector(n, 0.004);
  scene.add(quad);
});

// goal zone
let zoneMesh = null;
// layered defense: 1 danger (red), 2 combat (amber), 3 outer (green), measured from the goal center
let layerGroup = null;
function setLayers(rec) {
  if (layerGroup) { layerGroup.children.forEach((c) => c.material && c.material.map && c.material.map.dispose()); scene.remove(layerGroup); }
  layerGroup = null;
  if (!rec.layers) return;
  const gz = rec.goal_zone, gx = (gz[0][0] + gz[0][1]) / 2, gy = (gz[1][0] + gz[1][1]) / 2;
  const [r1, r2] = rec.layers, far = Math.hypot(x1 - x0, y1 - y0);
  layerGroup = new THREE.Group();
  const bands = [[0, r1, 0xe5484d, 0.30, "1 · DANGER ZONE"], [r1, r2, 0xf0a020, 0.20, "2 · COMBAT ZONE"], [r2, far, 0x3fb950, 0.10, "3 · OUTER ZONE"]];
  bands.forEach(([ri, ro, color, opacity, text]) => {
    const geo = ri > 0 ? new THREE.RingGeometry(ri, ro, 64, 1, -Math.PI / 2, Math.PI) : new THREE.CircleGeometry(ro, 64, -Math.PI / 2, Math.PI);
    const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color, transparent: true, opacity, side: THREE.DoubleSide, depthWrite: false }));
    m.position.set(gx, gy, 0.006);
    layerGroup.add(m);
    const edge = new THREE.Mesh(new THREE.RingGeometry(ro - 0.02, ro, 64, 1, -Math.PI / 2, Math.PI), new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide }));
    edge.position.set(gx, gy, 0.008);
    if (ro < far) layerGroup.add(edge);
    const tag = makeLabel("#" + color.toString(16).padStart(6, "0"));
    scene.remove(tag);
    setLabel(tag, text);
    const rmid = Math.min((ri + Math.min(ro, r2 + 1.5)) / 2, x1 - gx - 0.5);
    tag.position.set(gx + rmid, gy, 0.15);
    layerGroup.add(tag);
  });
  scene.add(layerGroup);
}
function setZone(gz) {
  if (zoneMesh) scene.remove(zoneMesh);
  const sx = gz[0][1] - gz[0][0], sy = gz[1][1] - gz[1][0], sz = gz[2][1] - gz[2][0];
  zoneMesh = new THREE.Group();
  const edges = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(sx, sy, sz)), new THREE.LineBasicMaterial({ color: 0xe04545 }));
  zoneMesh.add(box(sx, sy, sz, 0xe04545, 0.18), edges);
  zoneMesh.position.set((gz[0][0] + gz[0][1]) / 2, (gz[1][0] + gz[1][1]) / 2, (gz[2][0] + gz[2][1]) / 2);
  scene.add(zoneMesh);
}

// compact Tello: team-colored body (~60 x 45 x 35 mm), camera nub at the front, 4 motors and
// spinning props tucked close to the body
const S = 1.5; // drawn larger than life so it reads at room scale
function makeDrone(color) {
  const g = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.1 });
  const dark = new THREE.MeshStandardMaterial({ color: 0x262a31, roughness: 0.7 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.06 * S, 0.045 * S, 0.035 * S), bodyMat);
  body.castShadow = true;
  g.add(body);
  const cam = new THREE.Mesh(new THREE.BoxGeometry(0.006 * S, 0.014 * S, 0.012 * S), dark);
  cam.position.set(0.032 * S, 0, 0.004 * S);
  g.add(cam);
  const props = [];
  for (const [sx, sy] of [[1, 1], [1, -1], [-1, 1], [-1, -1]]) {
    const px = 0.036 * S * sx, py = 0.036 * S * sy;
    const motor = new THREE.Mesh(new THREE.CylinderGeometry(0.009 * S, 0.009 * S, 0.018 * S, 12), dark);
    motor.rotation.x = Math.PI / 2;
    motor.position.set(px, py, 0.008 * S);
    motor.castShadow = true;
    g.add(motor);
    const prop = new THREE.Mesh(new THREE.BoxGeometry(0.066 * S, 0.008 * S, 0.002 * S), dark);
    prop.position.set(px, py, 0.019 * S);
    g.add(prop);
    props.push(prop);
  }
  g.userData = { props, bodyMat, color };
  scene.add(g);
  return g;
}
let defenders = [], attackers = [], trails = [], strips = [], wraps = [], labels = [];
// floating name tag (canvas sprite) above each drone: name and what it is doing
function makeLabel(color) {
  const canvas = document.createElement("canvas");
  canvas.width = 512; canvas.height = 64;
  const tex = new THREE.CanvasTexture(canvas);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true }));
  sprite.scale.set(1.6, 0.2, 1);
  sprite.renderOrder = 10;
  sprite.userData = { canvas, tex, color, text: null };
  scene.add(sprite);
  return sprite;
}
function setLabel(sprite, text) {
  if (sprite.userData.text === text) return;
  sprite.userData.text = text;
  const { canvas, tex, color } = sprite.userData, ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.font = "600 34px system-ui, sans-serif";
  const w = Math.min(canvas.width, ctx.measureText(text).width + 24);
  ctx.fillStyle = "rgba(20, 22, 28, 0.78)";
  ctx.fillRect((canvas.width - w) / 2, 8, w, 48);
  ctx.fillStyle = color; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(text, canvas.width / 2, 33);
  tex.needsUpdate = true;
}
// yellow mesh strip hanging under a carrier; a flat patch around an attacker it caught
const meshMat = new THREE.MeshStandardMaterial({ color: 0xf2c418, roughness: 0.9, transparent: true, opacity: 0.8, side: THREE.DoubleSide });
function buildDrones(rec) {
  [...defenders, ...attackers, ...trails, ...strips, ...wraps, ...labels].forEach((o) => scene.remove(o));
  labels = [...rec.envs[0][0].d.map(() => makeLabel("#8fb6ff")), ...rec.envs[0][0].a.map(() => makeLabel("#ff8f86"))];
  const L = rec.net_length || 0.8;
  strips = rec.envs[0][0].d.map(() => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(0.012, 0.15, L), meshMat);
    m.visible = false;
    scene.add(m);
    return m;
  });
  wraps = rec.envs[0][0].a.map(() => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.2, 0.02), meshMat);
    m.visible = false;
    scene.add(m);
    return m;
  });
  const f = rec.envs[0][0];
  defenders = f.d.map(() => makeDrone(0x2f6fe8));
  attackers = f.a.map(() => makeDrone(0xe0362f));
  trails = [...defenders, ...attackers].map((g) => {
    const mat = new THREE.LineBasicMaterial({ color: g.userData.color, transparent: true, opacity: 0.55 });
    const line = new THREE.Line(new THREE.BufferGeometry(), mat);
    scene.add(line);
    return line;
  });
}

// --- playback --------------------------------------------------------------------------------
let rec, frames, t = 0, playing = true, last = null;
function load() {
  rec = DATA[$("ctrl").value];
  const sel = $("env"), keep = sel.value;
  sel.innerHTML = "";
  rec.envs.forEach((_, i) => sel.add(new Option(String(i), String(i))));
  sel.value = keep && keep < rec.envs.length ? keep : "0";
  setZone(rec.goal_zone);
  setLayers(rec);
  buildDrones(rec);
  pickEnv();
}
function pickEnv() {
  frames = rec.envs[+$("env").value];
  $("scrub").max = frames.length - 1;
  t = 0;
  const c = { win: 0, breach: 0, crash: 0, timeout: 0 };
  frames.forEach((f) => { if (f.end) c[f.end]++; });
  $("score").innerHTML = `<span>Rounds in clip: <b>${c.win + c.breach + c.crash + c.timeout}</b></span>` +
    `<span class="win">Wins <b>${c.win}</b></span><span class="breach">Breaches <b>${c.breach}</b></span>` +
    `<span class="crash">Crashes <b>${c.crash}</b></span>`;
}
function setCamera(kind) {
  const views = {
    overview: [[x1 + 1.5, y0 - 2.5, 4.2], [cx - 1, cy, 1.0]],
    goal: [[x0 + 0.6, cy, 2.4], [x1, cy, 0.9]],
    top: [[cx, cy, 11], [cx, cy, 0]],
    side: [[cx, y0 - 6.5, 1.6], [cx, cy, 1.2]],
  };
  const [eye, at] = views[kind];
  camera.position.set(...eye);
  controls.target.set(...at);
  controls.update();
}
function pose(i) {
  const f = frames[i], p = frames[Math.max(i - 1, 0)];
  const fresh = i > 0 && !p.end;
  const place = (g, pos, prev, alive) => {
    g.position.set(pos[0], pos[1], alive ? pos[2] : 0.03);
    // tilt toward the direction of flight like a real quadcopter
    const vx = fresh ? (pos[0] - prev[0]) / rec.dt : 0, vy = fresh ? (pos[1] - prev[1]) / rec.dt : 0;
    g.rotation.set(Math.max(-0.4, Math.min(0.4, -0.2 * vy)), Math.max(-0.4, Math.min(0.4, 0.2 * vx)), 0);
    g.userData.bodyMat.color.set(alive ? g.userData.color : 0x8b9099);
    g.userData.props.forEach((pr, k) => { pr.rotation.z += alive ? (k % 2 ? 0.9 : -0.9) : 0; });
  };
  f.d.forEach((pos, k) => place(defenders[k], pos, p.d[k], f.dalive ? f.dalive[k] : true));
  f.a.forEach((pos, k) => place(attackers[k], pos, p.a[k], f.alive[k]));
  const nd = f.d.length;
  f.d.forEach((pos, k) => {
    labels[k].position.set(pos[0], pos[1], ((f.dalive ? f.dalive[k] : true) ? pos[2] : 0.03) + 0.28);
    setLabel(labels[k], `${rec.def_names ? rec.def_names[k] : "D" + (k + 1)}${f.dl ? " \u00b7 " + f.dl[k] : ""}`);
  });
  f.a.forEach((pos, k) => {
    labels[nd + k].position.set(pos[0], pos[1], (f.alive[k] ? pos[2] : 0.03) + 0.28);
    setLabel(labels[nd + k], `${rec.att_names ? rec.att_names[k] : "A" + (k + 1)}${f.al ? " \u00b7 " + f.al[k] : ""}`);
  });
  const L = rec.net_length || 0.8;
  f.d.forEach((pos, k) => {
    const on = !!(f.net && f.net[k]) && (f.dalive ? f.dalive[k] : true);
    strips[k].visible = on;
    if (!on) return;
    // hangs below the drone and trails behind its motion
    const vx = fresh ? (pos[0] - p.d[k][0]) / rec.dt : 0, vy = fresh ? (pos[1] - p.d[k][1]) / rec.dt : 0;
    const tx = -vx * 0.3, ty = -vy * 0.3, len = Math.hypot(tx, ty, L);
    strips[k].position.set(pos[0] + tx / 2, pos[1] + ty / 2, pos[2] - 0.08 - L / 2);
    strips[k].rotation.set(Math.atan2(ty, L), -Math.atan2(tx, L), Math.atan2(vy, vx || 1e-6) * 0);
    strips[k].scale.set(1, 1, len / L);
  });
  f.a.forEach((pos, k) => {
    const on = !!(f.netted && f.netted[k]);
    wraps[k].visible = on;
    if (on) wraps[k].position.set(pos[0], pos[1], 0.04);
  });
  // 1 s trails within the current round
  let s = i;
  while (s > 0 && i - s < 1 / rec.dt && !frames[s - 1].end) s--;
  const all = [...f.d.map((_, k) => ["d", k]), ...f.a.map((_, k) => ["a", k])];
  all.forEach(([key, k], n) => {
    const pts = [];
    for (let j = s; j <= i; j++) pts.push(new THREE.Vector3(...frames[j][key][k]));
    trails[n].geometry.setFromPoints(pts);
    trails[n].visible = key === "d" ? (f.dalive ? f.dalive[k] : true) : f.alive[k];
  });
  $("scrub").value = i;
  $("clock").textContent = `t = ${(i * rec.dt).toFixed(1)} s / ${(frames.length * rec.dt).toFixed(0)} s`;
  let msg = "", cls = "";
  for (let j = i; j >= 0 && i - j < 1.5 / rec.dt; j--) if (frames[j].end) {
    msg = {
      win: "Defense wins: goal held",
      breach: "Breach: an attacker reached the goal tag",
      crash: "Lost: every defender went down",
      timeout: "Timeout",
    }[frames[j].end];
    cls = frames[j].end;
    break;
  }
  $("banner").textContent = msg;
  $("banner").className = "banner " + cls;
}
function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
function tick(now) {
  if (last !== null && playing) {
    t += (now - last) / 1000 / rec.dt * +$("speed").value;
    if (t >= frames.length) t = 0;
  }
  last = now;
  pose(Math.min(Math.floor(t), frames.length - 1));
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
$("ctrl").onchange = load;
$("env").onchange = pickEnv;
$("cam").onchange = (e) => setCamera(e.target.value);
$("play").onclick = () => { playing = !playing; $("play").textContent = playing ? "Pause" : "Play"; };
$("scrub").oninput = (e) => { t = +e.target.value; };
window.addEventListener("resize", resize);
resize();
setCamera("overview");
load();
requestAnimationFrame(tick);
</script>
</body>
</html>
